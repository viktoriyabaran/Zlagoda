<h2 class="text-white text-[24px] max-[480px]:text-[20px] font-black tracking-[2px] mb-1 text-center">
    {{ form_title }}
</h2>
<p class="text-white/80 text-[12px] font-normal tracking-[0.5px] mb-5 text-center">
    Fill in the details below
</p>

<form action="{{ form_action }}" method="post" class="w-full flex-1 flex flex-col">
    {% csrf_token %}
    {% if form.non_field_errors %}
        <div class="text-red-300 text-xs mb-3 px-2 py-1.5 rounded bg-red-500/10 border border-red-400/30">
            {{ form.non_field_errors }}
        </div>
    {% endif %}

    <div class="flex-1 overflow-y-auto pr-1 -mr-1
                grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-4 gap-y-3 content-start">
        {% for field in form %}
        <div>
            {% if field.errors %}
                <div class="text-red-300 text-[11px] mb-1">{{ field.errors }}</div>
            {% endif %}
            <label class="block text-white text-[10px] font-semibold tracking-widest uppercase mb-1"
                   for="{{ field.id_for_label }}">
                {{ field.label }}
            </label>
            {{ field }}
        </div>
        {% endfor %}
    </div>

    <div class="mt-5 flex justify-end">
        <button type="submit" class="btn w-auto px-10">Add</button>
    </div>
</form>
