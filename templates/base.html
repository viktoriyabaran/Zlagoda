{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Zlagoda{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    {% tailwind_css %}
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    {% block head %}{% endblock %}
</head>
<body class="min-h-screen flex items-center font-[Montserrat] overflow-auto"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
      hx-boost="true">

    <div class="fixed inset-0 bg-cover bg-center bg-no-repeat z-0"
         style="background-image: url('{% static 'images/background.jpg' %}')"></div>

    {% block header %}{% include "_header.html" %}{% endblock %}

    {% block layout %}
    <div class="relative z-10 isolate w-[340px] min-h-[520px] rounded-2xl overflow-hidden
                flex flex-col items-center pt-8 pb-6 px-6
                backdrop-blur-md bg-white/[0.08]
                shadow-[0_8px_32px_rgba(0,0,0,0.18),inset_0_1px_0_rgba(255,255,255,0.12)]
                max-[480px]:w-[92vw] max-[480px]:min-h-[80vh] max-[480px]:px-5 max-[480px]:pt-6 max-[480px]:pb-5
                {% block card_class %}mx-auto{% endblock %}">
        {% block content %}{% endblock %}
    </div>
    {% endblock %}
</body>
</html>
