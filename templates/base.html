{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Zlagoda{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    {% tailwind_css %}
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <script>
        (function () {
            try {
                if (localStorage.getItem('zlagoda-sidebar') === 'collapsed') {
                    document.documentElement.setAttribute('data-sidebar-collapsed', '');
                }
            } catch (e) {}
        })();
    </script>
    <style>
        .glass {
            isolation: isolate;
            border-radius: 1rem;
            overflow: hidden;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        .app-layout {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: stretch;
            gap: 1.5rem;
            height: 100vh;
            padding: 74px 0.75rem 1rem;
            box-sizing: border-box;
        }
        .app-layout > .sidebar { flex: 0 0 340px; }
        .app-layout > .panel   { flex: 1 1 0%; min-width: 0; display: flex; flex-direction: column; }

        @media (max-width: 900px) {
            .app-layout { flex-direction: column; height: auto; min-height: 100vh; }
            .app-layout > .sidebar,
            .app-layout > .panel { flex: 0 0 auto; width: 100%; }
        }

        .auth-layout {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem;
        }

        .sidebar { flex-direction: column; padding: 1.25rem 1rem; gap: 0.4rem; transition: flex-basis 0.22s ease; }
        .sidebar, .sidebar-nav { display: flex; }

        .sidebar-nav { flex-direction: column; gap: 0.1rem; flex: 1 1 auto; min-height: 0; overflow-y: auto; }
        .nav-group { position: relative; }
        .nav-group-head {
            display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0.6rem 0.2rem;
            color: rgba(255, 255, 255, 0.55);
            font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
        }
        .nav-ico { width: 18px; height: 18px; flex: 0 0 18px; }
        .nav-group-items { display: flex; flex-direction: column; }
        .flyout-title { display: none; }
        .nav-item {
            display: block; padding: 0.4rem 0.6rem 0.4rem 1.9rem; border-radius: 0.55rem;
            font-size: 13px; color: rgba(255, 255, 255, 0.82); text-decoration: none; white-space: nowrap;
            transition: background 0.15s, color 0.15s;
        }
        .nav-item:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
        .nav-item.active { background: rgba(255, 255, 255, 0.18); color: #fff; font-weight: 700; }

        .sidebar-toggle {
            margin-top: 0.4rem; display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem 0.6rem;
            border: none; background: transparent; color: rgba(255, 255, 255, 0.7);
            font-family: inherit; font-size: 12px; cursor: pointer; border-radius: 0.55rem;
        }
        .sidebar-toggle:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
        .sidebar-toggle .chevron { width: 18px; height: 18px; flex: 0 0 18px; transition: transform 0.2s; }

        html[data-sidebar-collapsed] .app-layout > .sidebar {
            flex-basis: 78px; overflow: visible; position: relative; z-index: 60;
            backdrop-filter: none; -webkit-backdrop-filter: none; isolation: auto;
        }
        html[data-sidebar-collapsed] .app-layout > .sidebar::before {
            content: ""; position: absolute; inset: 0; z-index: -1;
            border-radius: inherit; pointer-events: none;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        html[data-sidebar-collapsed] .sidebar-nav { overflow: visible; }
        html[data-sidebar-collapsed] .sidebar .nav-text { display: none; }
        html[data-sidebar-collapsed] .nav-group-head { justify-content: center; padding: 0.55rem 0; color: rgba(255, 255, 255, 0.8); }
        html[data-sidebar-collapsed] .nav-group.is-active .nav-group-head { color: #fff; }
        html[data-sidebar-collapsed] .sidebar-toggle { justify-content: center; }
        html[data-sidebar-collapsed] .sidebar-toggle .chevron { transform: rotate(180deg); }

        html[data-sidebar-collapsed] .nav-group-items {
            position: absolute; left: 100%; top: 0; margin-left: 0.5rem; z-index: 50;
            min-width: 190px; padding: 0.4rem;
            border-radius: 0.75rem;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            opacity: 0; visibility: hidden; transform: translateX(-4px);
            transition: opacity 0.15s, transform 0.15s, visibility 0.15s;
        }
        html[data-sidebar-animating] .nav-group-items { transition: none; }
        html[data-sidebar-collapsed] .nav-group-items::before {
            content: ""; position: absolute; left: -0.5rem; top: 0; bottom: 0; width: 0.5rem;
        }
        html[data-sidebar-collapsed] .nav-group:hover .nav-group-items {
            opacity: 1; visibility: visible; transform: translateX(0);
        }
        html[data-sidebar-collapsed] .flyout-title {
            display: block; padding: 0.2rem 0.6rem 0.4rem;
            font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
            color: rgba(255, 255, 255, 0.55);
        }
        html[data-sidebar-collapsed] .nav-item { padding-left: 0.6rem; }

        @media (max-width: 900px) {
            html[data-sidebar-collapsed] .app-layout > .sidebar { flex: 0 0 auto; overflow: visible; }
            html[data-sidebar-collapsed] .sidebar .nav-text { display: revert; }
            html[data-sidebar-collapsed] .sidebar-nav { overflow-y: auto; }
            html[data-sidebar-collapsed] .nav-group-head { justify-content: flex-start; padding: 0.55rem 0.6rem 0.2rem; }
            html[data-sidebar-collapsed] .nav-item { padding-left: 1.9rem; }
            html[data-sidebar-collapsed] .nav-group-items {
                position: static; margin-left: 0; min-width: 0; padding: 0; z-index: auto;
                background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none;
                border: none; box-shadow: none; opacity: 1; visibility: visible; transform: none;
            }
            html[data-sidebar-collapsed] .flyout-title { display: none; }
            html[data-sidebar-collapsed] .sidebar-toggle .chevron { transform: none; }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="min-h-screen font-[Montserrat] text-white overflow-x-hidden"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
      hx-boost="true">

    <div class="fixed inset-0 bg-cover bg-center bg-no-repeat z-0"
         style="background-image: url('{% static 'images/background.jpg' %}')"></div>

    {% block header %}{% include "_header.html" %}{% endblock %}

    {% block layout %}{% endblock %}

    <div id="confirm-modal" class="hidden fixed inset-0 z-[200] items-center justify-center"
         onclick="zConfirmCancel()">
        <div onclick="event.stopPropagation()" style="
            width: min(420px, 90vw);
            padding: 36px 32px 32px;
            border-radius: 32px;
            border: 2px solid #EABFFF;
            backdrop-filter: blur(40px);
            background: radial-gradient(ellipse 127.02% 151.92% at 15.32% 21.04%, rgba(164.69, 238.74, 255, 0.20) 0%, rgba(109.97, 190.80, 244.37, 0.04) 77%, rgba(69.95, 144.07, 212.50, 0) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        ">
            <svg style="width: 56px; height: 56px; flex-shrink: 0;" fill="none" stroke="white" stroke-width="1.2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>

            <div style="text-align: center; color: white; font-size: 20px; font-family: Montserrat, sans-serif; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;">Please confirm</div>

            <div id="confirm-modal-message" style="text-align: center; color: rgba(255,255,255,0.80); font-size: 15px; font-family: Montserrat, sans-serif; font-weight: 500; line-height: 1.4;"></div>

            <div style="display: flex; gap: 12px; margin-top: 10px;">
                <button type="button" onclick="zConfirmCancel()"
                        style="width: 110px; height: 44px; background: transparent; border: 2px solid rgba(255,255,255,0.5); border-radius: 12px; color: white; font-size: 18px; font-family: Montserrat, sans-serif; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; outline: none;">
                    Cancel
                </button>
                <button type="button" onclick="zConfirmOk()"
                        style="width: 110px; height: 44px; background: white; box-shadow: 0px 6px 10px rgba(255,255,255,0.25); border-radius: 12px; color: #385772; font-size: 18px; font-family: Montserrat, sans-serif; font-weight: 700; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; outline: none;">
                    Delete
                </button>
            </div>
        </div>
    </div>

    <script>
        window.toggleSidebar = function () {
            var html = document.documentElement;
            html.setAttribute('data-sidebar-animating', '');
            if (html.hasAttribute('data-sidebar-collapsed')) {
                html.removeAttribute('data-sidebar-collapsed');
                try { localStorage.setItem('zlagoda-sidebar', 'expanded'); } catch (e) {}
            } else {
                html.setAttribute('data-sidebar-collapsed', '');
                try { localStorage.setItem('zlagoda-sidebar', 'collapsed'); } catch (e) {}
            }
            requestAnimationFrame(function () {
                requestAnimationFrame(function () { html.removeAttribute('data-sidebar-animating'); });
            });
        };

        window.zConfirmHide = function () {
            var m = document.getElementById('confirm-modal');
            m.classList.add('hidden');
            m.classList.remove('flex');
        };
        window.zConfirmOk = function () {
            window.zConfirmHide();
            var resolve = window.zConfirmResolve;
            window.zConfirmResolve = null;
            if (resolve) resolve();
        };
        window.zConfirmCancel = function () {
            window.zConfirmHide();
            window.zConfirmResolve = null;
        };
        if (!window.__zConfirmInit) {
            window.__zConfirmInit = true;
            document.body.addEventListener('htmx:confirm', function (e) {
                if (!e.detail.question) return;
                e.preventDefault();
                document.getElementById('confirm-modal-message').innerText = e.detail.question;
                window.zConfirmResolve = function () { e.detail.issueRequest(true); };
                var m = document.getElementById('confirm-modal');
                m.classList.remove('hidden');
                m.classList.add('flex');
            });
        }
    </script>
</body>
</html>
