{% extends "base.html" %}

{% block title %}Add Customer{% endblock %}

{% block content %}
    <h1>Add Customer</h1>
    <form action="{% url 'customers:add-customer' %}" method="post">
        {% csrf_token %}
        {% for field in form %}
        <div>
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <div>{{ field.errors }}</div>
            {% endif %}
        </div>
        {% endfor %}
        <button type="submit">Add</button>
    </form>
{% endblock %}
