<aside class="sidebar glass" id="app-sidebar">
    <nav class="sidebar-nav">
        {% for group in sidebar.groups %}
        <div class="nav-group {% if group.active %}is-active{% endif %}">
            <div class="nav-group-head">
                <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    {% if group.icon == "receipt" %}
                        <path d="M5 3v18l2.5-1.5L10 21l2-1.5L14 21l2.5-1.5L19 21V3l-2.5 1.5L14 3l-2 1.5L10 3 7.5 4.5z"/><path d="M8 8h8M8 12h8"/>
                    {% elif group.icon == "box" %}
                        <path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>
                    {% elif group.icon == "users" %}
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                    {% elif group.icon == "badge" %}
                        <rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M5 17a3 3 0 0 1 6 0M15 9h4M15 13h4"/>
                    {% elif group.icon == "chart" %}
                        <path d="M3 3v18h18"/><path d="M7 16l4-4 4 4 4-4"/>
                    {% endif %}
                </svg>
                <span class="nav-text">{{ group.label }}</span>
            </div>
            <div class="nav-group-items">
                <span class="flyout-title">{{ group.label }}</span>
                {% for item in group.items %}
                <a href="{{ item.url }}" class="nav-item {% if item.active %}active{% endif %}">{{ item.label }}</a>
                {% endfor %}
            </div>
        </div>
        {% endfor %}
    </nav>

    <button type="button" class="sidebar-toggle" onclick="toggleSidebar()"
            aria-label="Collapse or expand sidebar" title="Collapse / expand">
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"/>
        </svg>
        <span class="nav-text">Collapse</span>
    </button>
</aside>
