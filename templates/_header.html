<header id="site-header"
        class="fixed top-3 left-3 right-3 z-20 isolate
               h-[44px] flex items-center justify-between gap-6
               px-5 rounded-xl
               backdrop-blur-md bg-white/[0.08]
               shadow-[0_8px_32px_rgba(0,0,0,0.18),inset_0_1px_0_rgba(255,255,255,0.12)]
               text-white">
    <a href="{% url 'core:home' %}"
       class="font-black tracking-[2px] text-base no-underline hover:opacity-80">
        ZLAGODA
    </a>

    <div class="flex items-center gap-5">
        <form action="{% url 'core:logout' %}" method="post" class="m-0">
          {% csrf_token %}
          <button type="submit"
                  class="text-[11px] font-semibold tracking-widest uppercase hover:opacity-80
                         bg-transparent border-0 p-0 cursor-pointer text-white font-[Montserrat] leading-none">
              Log out
          </button>
        </form>
    </div>
</header>
